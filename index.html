<!-- =====================================================================
     ATTRAPE-ERREUR DE SECOURS — affiche directement à l'écran (au lieu
     d'un écran blanc silencieux) le message exact de toute erreur qui
     empêcherait l'application de démarrer. Purement temporaire/diagnostic :
     à retirer une fois le problème d'écran blanc résolu. Ne remplace rien
     d'existant, s'ajoute juste en plus, tout en haut, pour être actif même
     si un fichier plus loin plante.
     ===================================================================== -->
<style>
  #boot-error-box { display:none; position:fixed; inset:0; background:#fff8f0; color:#5a1a1a;
    font-family: monospace, sans-serif; font-size:13px; padding:20px; z-index:999999;
    overflow:auto; white-space:pre-wrap; word-break:break-word; line-height:1.5; }
  #boot-error-box h2 { color:#b02a2a; font-size:17px; margin:0 0 12px; }
</style>
<div id="boot-error-box"></div>
<script>
  function showBootError(label, detail) {
    var box = document.getElementById("boot-error-box");
    if (!box) return;
    box.style.display = "block";
    box.innerHTML = "<h2>⚠️ Erreur au chargement</h2>" +
      "<div><b>" + label + "</b></div><div style='margin-top:10px'>" +
      String(detail).replace(/</g, "&lt;") + "</div>";
  }
  window.addEventListener("error", function (e) {
    showBootError(
      "Erreur JavaScript : " + (e.message || "inconnue"),
      "Fichier : " + (e.filename || "?") + "\nLigne : " + (e.lineno || "?") + ", Colonne : " + (e.colno || "?") +
      (e.error && e.error.stack ? "\n\n" + e.error.stack : "")
    );
  });
  window.addEventListener("unhandledrejection", function (e) {
    var reason = e.reason;
    showBootError(
      "Erreur non gérée (promesse) :",
      (reason && reason.stack) ? reason.stack : String(reason)
    );
  });
</script>
